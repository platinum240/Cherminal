name: appimage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libfuse2 xvfb
          pip install python-appimage
          packaging/build-appimage.sh
      - name: Smoke test
        run: |
          app=$(ls dist/*.AppImage)
          XDG_CONFIG_HOME=$(mktemp -d) "$app" --list
          XDG_CONFIG_HOME=$(mktemp -d) "$app" keycapture --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Cherminal-AppImage
          path: dist/*.AppImage
      - name: eLux package tree
        run: |
          packaging/elux/build-epm.sh "$(ls dist/*.AppImage)"
          # The unpacked app must run from wherever it is installed (/opt/cherminal).
          tree=$(ls -d dist/cherminal-elux-*/)
          XDG_CONFIG_HOME=$(mktemp -d) "$tree/input/cherminal/opt/cherminal/AppRun" --version
          XDG_CONFIG_HOME=$(mktemp -d) "$tree/input/cherminal/opt/cherminal/AppRun" --list
          # The slimmed Qt must still open a window on X11: still running after
          # 10 seconds (timeout's 124) means it started; a missing library
          # makes Qt abort straight away.
          status=0
          XDG_CONFIG_HOME=$(mktemp -d) timeout 10 xvfb-run -a \
              "$tree/input/cherminal/opt/cherminal/AppRun" || status=$?
          [ "$status" -eq 124 ] || { echo "Cherminal exited with $status" >&2; exit 1; }
          du -sh dist/*.AppImage "$tree/input"
      - uses: actions/upload-artifact@v4
        with:
          name: Cherminal-eLux-package-tree
          path: dist/cherminal-elux-*.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/cherminal-elux-*.tar.gz
