name: macos
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel Macs each get their own build: PyQt6's
        # wheels are for one architecture.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unsigned: signing and notarization happen separately (docs/MACOS.md).
      - name: Build Cherminal.app, .dmg and .pkg
        run: packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cherminal-macOS-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.pkg
